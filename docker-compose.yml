services:
  postgres:
    image: postgres:16-alpine
    container_name: logos-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos_dev
      POSTGRES_DB: logos_financeiro
    volumes:
      - logos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logos -d logos_financeiro"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: logos-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - logos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ocr:
    build: ./services/ocr
    container_name: logos-ocr
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      - OCR_LANG=pt
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  logos_postgres_data:
  logos_redis_data:
